[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudops-openkite"
version = "0.2.0"
description = "Natural-language AWS operations agent — a LangGraph ReAct loop over a typed boto3 toolbox."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darshil", email = "darshil3011@gmail.com" }]
keywords = ["aws", "langgraph", "langchain", "anthropic", "claude", "react-agent", "finops", "devops", "boto3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "anthropic>=0.40.0",
    "boto3>=1.35.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.0"]
openai = ["langchain-openai>=0.3.0"]
google = ["langchain-google-genai>=2.0.0"]
mistral = ["langchain-mistralai>=0.2.0"]
groq = ["langchain-groq>=0.2.0"]
qwen = ["langchain-openai>=0.3.0"]
ollama = ["langchain-ollama>=0.2.0"]
all-llms = [
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mistralai>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-ollama>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "moto[ec2,s3,iam,rds,awslambda,cloudwatch,cloudtrail,secretsmanager]>=5.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/darshil3011/openkite"
Repository = "https://github.com/darshil3011/openkite"
Issues = "https://github.com/darshil3011/openkite/issues"
Changelog = "https://github.com/darshil3011/openkite/blob/main/CHANGELOG.md"

[project.scripts]
openkite = "openkite.cli:app"

[tool.setuptools.packages.find]
include = ["openkite*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:langgraph.*",
    "ignore::PendingDeprecationWarning",
]
